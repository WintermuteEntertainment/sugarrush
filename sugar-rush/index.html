<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sugar Rush</title>
  <style>
/* ============================================
   SUGAR RUSH — Core Stylesheet
   ============================================ */
:root {
  --zone-green: #4CAF50;
  --zone-yellow: #FFC107;
  --zone-red: #F44336;
  --bg-body: #1a1a2e;
  --bg-card: #f5f0e8;
  --text-primary: #2c2c2c;
  --text-secondary: #666;
  --text-light: #f5f0e8;
  --accent: #5b8fb9;
  --accent-hover: #4a7a9e;
  --accent-warm: #e8834a;
  --companion-bg: #3d5a80;
  --companion-text: #f5f0e8;
  --hud-bg: #16213e;
  --hud-text: #e0e0e0;
  --border: #c4b89e;
  --font-body: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --hud-height: 60px;
  --passage-max-width: 720px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  color: var(--text-primary);
  background: var(--bg-body);
}
#game { height: 100%; display: flex; flex-direction: column; position: relative; }
.hidden { display: none !important; }

/* --- HUD --- */
#hud {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 8px 20px; background: var(--hud-bg);
  color: var(--hud-text); font-size: 14px; height: var(--hud-height);
  flex-shrink: 0; z-index: 100; border-bottom: 2px solid #0f3460;
}
#hud > div { display: flex; align-items: center; gap: 6px; }
#hud-bg-value { font-size: 22px; font-weight: 700; min-width: 40px; text-align: center; transition: color 0.3s; }
#hud-bg-trend { font-size: 18px; min-width: 20px; }
#hud-bg-bar, #hud-energy-bar { width: 80px; height: 8px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; }
#hud-bg-fill, #hud-energy-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease, background-color 0.5s ease; }
#hud-bg-fill { background: var(--zone-green); width: 50%; }
#hud-energy-fill { background: var(--accent-warm); width: 85%; }
#hud-confidence-value { font-size: 18px; font-weight: 700; }
#hud-day { font-weight: 700; }
#hud-clock { opacity: 0.8; }
#hud-beta-cells { font-weight: 700; color: var(--accent-warm); }
#hud-beta-label { opacity: 0.7; font-size: 12px; }

/* --- Main Narrative Area --- */
#narrative {
  flex: 1; overflow-y: auto; display: flex; justify-content: center;
  padding: 30px 20px 40px; background: var(--bg-body);
}
#passage-container { max-width: var(--passage-max-width); width: 100%; }

/* --- Passage Styling --- */
.passage {
  background: var(--bg-card); border-radius: 12px; padding: 30px 35px;
  margin-bottom: 20px; border: 2px solid var(--border); animation: fadeIn 0.4s ease;
}
.passage h2 { font-size: 24px; font-weight: 700; margin-bottom: 16px; color: var(--text-primary); }
.passage p { margin-bottom: 12px; }
.passage p:last-child { margin-bottom: 0; }
.passage ul, .passage ol { margin: 8px 0 12px 24px; }
.passage li { margin-bottom: 4px; }
.passage-scene { font-style: italic; color: var(--text-secondary); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }

/* --- Choices --- */
.choices { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.choice-btn {
  display: block; width: 100%; padding: 14px 20px; background: var(--accent);
  color: white; border: 2px solid transparent; border-radius: 8px;
  font-family: var(--font-body); font-size: 16px; text-align: left;
  cursor: pointer; transition: all 0.15s ease; line-height: 1.4;
}
.choice-btn:hover { background: var(--accent-hover); transform: translateX(4px); }
.choice-btn:active { transform: translateX(2px); }
.continue-btn {
  display: inline-block; margin-top: 20px; padding: 12px 32px;
  background: var(--accent); color: white; border: none; border-radius: 8px;
  font-family: var(--font-body); font-size: 16px; cursor: pointer; transition: background 0.15s;
}
.continue-btn:hover { background: var(--accent-hover); }

/* --- Player Avatar (HUD) --- */
#hud-avatar {
  display: flex; align-items: center; gap: 6px; cursor: default;
}
#hud-avatar-figure {
  display: flex; flex-direction: column; align-items: center;
  line-height: 1.1; font-size: 16px; gap: 0;
}
#hud-avatar-figure .av-hat { font-size: 12px; height: 14px; }
#hud-avatar-figure .av-face { font-size: 18px; }
#hud-avatar-figure .av-shirt { width: 20px; height: 14px; border-radius: 3px; margin: -2px auto 0; }
#hud-avatar-figure .av-shoes { font-size: 10px; height: 12px; }
#hud-avatar-name { font-weight: 600; font-size: 13px; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* --- Companion (Pip) --- */
#companion {
  position: fixed; bottom: 20px; left: 20px; display: flex; align-items: flex-end;
  gap: 10px; z-index: 90; transition: opacity 0.3s, transform 0.3s;
}
#companion.hidden { display: none !important; }
#companion.entering { animation: companionEnter 0.4s cubic-bezier(0.34,1.56,0.64,1); }

#companion-face {
  width: 60px; height: 60px; background: var(--companion-bg); border-radius: 14px;
  border: 2px solid #2c4460; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; position: relative; overflow: visible; cursor: pointer;
  animation: pipFloat 3s ease-in-out infinite;
  transition: transform 0.2s, box-shadow 0.3s;
}
#companion-face:hover { transform: scale(1.08); box-shadow: 0 4px 20px rgba(126,200,227,0.3); }
#companion-face:active { animation: pipBounce 0.4s ease; }

/* Pip's visor (screen) */
#pip-visor {
  width: 40px; height: 24px; background: #0d2137; border-radius: 5px;
  position: absolute; display: flex; align-items: center; justify-content: center;
  overflow: hidden; box-shadow: inset 0 0 8px rgba(126,200,227,0.15);
}

/* Pip's eyes - two glowing dots that animate */
#pip-eyes {
  display: flex; gap: 10px; align-items: center; position: relative;
}
.pip-eye {
  width: 6px; height: 6px; background: #7ec8e3; border-radius: 50%;
  box-shadow: 0 0 6px #7ec8e3, 0 0 12px rgba(126,200,227,0.3);
  transition: all 0.3s ease;
}
/* Blink */
#companion-face.blink .pip-eye { height: 2px; }
/* Happy - eyes become arcs */
#companion-face.happy .pip-eye {
  height: 3px; width: 8px; border-radius: 8px 8px 0 0;
  box-shadow: 0 0 8px #7ec8e3, 0 0 16px rgba(126,200,227,0.4);
}
/* Worried - eyes shrink, shift up */
#companion-face.worried .pip-eye {
  width: 5px; height: 5px; background: #e8834a;
  box-shadow: 0 0 6px #e8834a, 0 0 12px rgba(232,131,74,0.3);
  transform: translateY(-1px);
}
/* Alert (low BG) - eyes pulse red */
#companion-face.alert .pip-eye {
  background: #F44336;
  box-shadow: 0 0 8px #F44336, 0 0 16px rgba(244,67,54,0.5);
  animation: pipAlertPulse 0.6s ease-in-out infinite alternate;
}
/* Thinking */
#companion-face.thinking .pip-eye:last-child { opacity: 0; }
#companion-face.thinking .pip-eye:first-child {
  width: 8px; height: 8px;
  animation: pipThink 1.2s ease-in-out infinite;
}
/* Speaking bounce */
#companion-face.speaking { animation: pipSpeak 0.15s ease-in-out 3; }

/* Pip's antenna */
#pip-antenna {
  position: absolute; top: -6px; width: 2px; height: 8px;
  background: #5a8aad; border-radius: 1px;
}
#pip-antenna::after {
  content: ''; position: absolute; top: -4px; left: -2px;
  width: 6px; height: 6px; background: #7ec8e3; border-radius: 50%;
  box-shadow: 0 0 6px rgba(126,200,227,0.5);
  animation: pipAntennaGlow 2s ease-in-out infinite alternate;
}

/* Pip's status LED */
#pip-led {
  position: absolute; bottom: 4px; right: 6px;
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--zone-green);
  box-shadow: 0 0 4px var(--zone-green);
  animation: pipLedPulse 2s ease-in-out infinite;
}

#companion-bubble {
  background: var(--companion-bg); color: var(--companion-text);
  padding: 12px 16px; border-radius: 12px 12px 12px 4px;
  max-width: 340px; font-size: 15px; line-height: 1.5;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  animation: bubblePop 0.3s cubic-bezier(0.34,1.56,0.64,1);
}

/* Pip name tag */
#pip-nametag {
  position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%);
  font-size: 9px; color: #7ec8e3; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; opacity: 0.7; white-space: nowrap;
}

/* --- Character Creation --- */
.creation-panel {
  background: var(--bg-card); border-radius: 12px; padding: 30px 35px;
  margin-bottom: 20px; border: 2px solid var(--border); animation: fadeIn 0.4s ease;
}
.creation-panel h2 { font-size: 22px; margin-bottom: 20px; }
.creation-field { margin-bottom: 20px; }
.creation-field label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 15px; }
.creation-field input[type="text"] {
  width: 100%; max-width: 300px; padding: 10px 14px; border: 2px solid var(--border);
  border-radius: 6px; font-family: var(--font-body); font-size: 16px; background: white;
}
.creation-field input[type="text"]:focus { outline: none; border-color: var(--accent); }

.option-picker { display: flex; gap: 10px; flex-wrap: wrap; }
.option-pick {
  width: 64px; height: 64px; border: 3px solid var(--border); border-radius: 10px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 28px; background: white; transition: all 0.15s;
}
.option-pick:hover { border-color: var(--accent); transform: scale(1.05); }
.option-pick.selected { border-color: var(--accent-warm); background: #FFF8E1; }

.device-choice { display: flex; gap: 12px; margin-bottom: 12px; }
.device-option {
  flex: 1; padding: 16px; background: white; border: 3px solid var(--border);
  border-radius: 10px; cursor: pointer; transition: all 0.15s; text-align: center;
}
.device-option:hover { border-color: var(--accent); }
.device-option.selected { border-color: var(--accent-warm); background: #FFF8E1; }
.device-option h3 { font-size: 16px; margin-bottom: 6px; }
.device-option p { font-size: 13px; color: var(--text-secondary); }

.difficulty-choice { display: flex; gap: 12px; }
.difficulty-option {
  flex: 1; padding: 20px; background: white; border: 3px solid var(--border);
  border-radius: 10px; cursor: pointer; transition: all 0.15s;
}
.difficulty-option:hover { border-color: var(--accent); }
.difficulty-option.selected { border-color: var(--accent-warm); background: #FFF8E1; }
.difficulty-option h3 { font-size: 17px; margin-bottom: 4px; }
.difficulty-option p { font-size: 14px; color: var(--text-secondary); }

/* --- Title Screen --- */
.title-screen { text-align: center; padding: 60px 20px; }
.title-screen h1 { font-size: 52px; font-weight: 800; color: var(--text-light); margin-bottom: 12px; letter-spacing: -1px; }
.title-screen .subtitle { font-size: 18px; color: var(--accent); margin-bottom: 40px; }
.title-screen .start-btn {
  display: inline-block; padding: 16px 48px; background: var(--accent-warm); color: white;
  border: none; border-radius: 10px; font-family: var(--font-body); font-size: 20px;
  font-weight: 700; cursor: pointer; transition: all 0.15s;
}
.title-screen .start-btn:hover { background: #d4733c; transform: scale(1.03); }

/* --- Beta Cell Notification --- */
.beta-cell-notification {
  position: fixed; top: calc(var(--hud-height) + 16px); right: 20px;
  background: linear-gradient(135deg, #1a3550, #2c5a80); color: white;
  padding: 14px 20px; border-radius: 10px; border: 2px solid #7ec8e3;
  font-size: 15px; z-index: 200; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  animation: slideInRight 0.3s ease, fadeOut 0.5s ease 2.5s forwards;
}
.beta-cell-notification .beta-icon {
  display: inline-block; width: 20px; height: 20px; border-radius: 50%;
  margin-right: 8px; vertical-align: middle; box-shadow: 0 0 8px currentColor;
}
.beta-icon.blue { background: #42A5F5; color: #42A5F5; }
.beta-icon.green { background: #66BB6A; color: #66BB6A; }
.beta-icon.gold { background: #FFD54F; color: #FFD54F; }
.beta-icon.red { background: #EF5350; color: #EF5350; }

/* --- Meal Table --- */
.meal-options { width: 100%; margin: 16px 0; border-collapse: collapse; }
.meal-options td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.meal-options tr:last-child td { border-bottom: none; }

/* --- Dose Input --- */
.dose-input-group {
  display: flex; align-items: center; gap: 12px; margin: 16px 0;
  padding: 16px; background: white; border-radius: 8px; border: 2px solid var(--border);
}
.dose-input-group label { font-weight: 600; }
.dose-input {
  width: 80px; padding: 8px 12px; border: 2px solid var(--border); border-radius: 6px;
  font-size: 20px; font-weight: 700; text-align: center; font-family: var(--font-body);
}
.dose-input:focus { outline: none; border-color: var(--accent); }
.dose-unit { color: var(--text-secondary); }
.dose-confirm {
  padding: 8px 20px; background: var(--accent); color: white;
  border: none; border-radius: 6px; font-size: 15px; cursor: pointer;
}
.dose-confirm:hover { background: var(--accent-hover); }

/* --- Summary --- */
.summary-panel {
  background: var(--bg-card); border-radius: 12px; padding: 30px;
  border: 2px solid var(--border); margin-bottom: 16px; animation: fadeIn 0.4s ease;
}
.summary-panel h2 { font-size: 22px; margin-bottom: 16px; text-align: center; }
.summary-stat {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.summary-stat:last-child { border-bottom: none; }
.summary-stat .label { color: var(--text-secondary); }
.summary-stat .value { font-weight: 700; font-size: 18px; }
.tir-bar { width: 100%; height: 24px; background: var(--zone-red); border-radius: 6px; overflow: hidden; margin: 12px 0; }
.tir-fill { height: 100%; background: var(--zone-green); border-radius: 6px; transition: width 1s ease; }

/* --- Screen Effects --- */
#screen-effects { position: fixed; inset: 0; pointer-events: none; z-index: 80; transition: all 0.5s ease; }
/* Edge glow only: nothing blurs or shakes, so text always stays readable. */
#screen-effects.low-mild { box-shadow: inset 0 0 50px rgba(255, 193, 7, 0.25); }
#screen-effects.low-severe { box-shadow: inset 0 0 90px rgba(244, 67, 54, 0.4); animation: edgePulse 1.2s ease-in-out infinite; }
#screen-effects.high-mild { box-shadow: inset 0 0 50px rgba(255, 152, 0, 0.2); }
#screen-effects.high-severe { box-shadow: inset 0 0 80px rgba(255, 87, 34, 0.32); animation: edgePulse 2s ease-in-out infinite; }

/* --- Animations --- */
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes slideInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
@keyframes companionEnter {
  from { opacity: 0; transform: translateY(30px) scale(0.8); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes pipFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
@keyframes pipBounce {
  0% { transform: scale(1); }
  30% { transform: scale(0.9); }
  60% { transform: scale(1.1); }
  100% { transform: scale(1); }
}
@keyframes pipSpeak {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}
@keyframes pipAlertPulse {
  from { opacity: 0.6; } to { opacity: 1; }
}
@keyframes pipAntennaGlow {
  from { box-shadow: 0 0 4px rgba(126,200,227,0.3); }
  to { box-shadow: 0 0 10px rgba(126,200,227,0.7); }
}
@keyframes pipLedPulse {
  0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
}
@keyframes bubblePop {
  from { opacity: 0; transform: scale(0.85) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes pipThink {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
}
@keyframes tremor-mild { 0% { transform: translate(0,0); } 25% { transform: translate(1px,-1px); } 50% { transform: translate(-1px,1px); } 75% { transform: translate(1px,0); } 100% { transform: translate(0,0); } }
@keyframes tremor-severe { 0% { transform: translate(0,0); } 25% { transform: translate(3px,-2px); } 50% { transform: translate(-3px,2px); } 75% { transform: translate(2px,-1px); } 100% { transform: translate(0,0); } }

#narrative::-webkit-scrollbar { width: 8px; }
#narrative::-webkit-scrollbar-track { background: transparent; }
#narrative::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

/* --- Journal Overlay --- */
#journal-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(10, 12, 24, 0.92); overflow-y: auto;
  padding: 40px 20px; animation: fadeIn 0.25s ease;
}
#journal-overlay .journal-cell { transition: transform 0.12s ease; }
#journal-overlay .journal-cell:hover { transform: scale(1.04); }

/* --- Mini-Game Overlay --- */
#minigame-overlay {
  position: fixed; inset: 0; z-index: 250;
  background: var(--bg-body); display: flex; align-items: center; justify-content: center;
  padding: 20px; animation: fadeIn 0.3s ease;
}
.minigame-panel {
  background: var(--bg-card); border-radius: 14px; padding: 28px 32px;
  max-width: 680px; width: 100%; border: 2px solid var(--border);
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
}
.minigame-panel h2 { font-size: 24px; margin-bottom: 8px; }
.minigame-panel .mg-subtitle { color: var(--text-secondary); margin-bottom: 20px; font-size: 15px; }
.mg-legend {
  background: #fff8ea; border: 2px solid var(--border); border-radius: 10px;
  padding: 12px 16px; margin-bottom: 18px; font-size: 14px;
}
.mg-legend summary { cursor: pointer; font-size: 15px; padding: 4px 0; list-style: none; }
.mg-legend summary::-webkit-details-marker { display: none; }
.mg-legend summary::before { content: '▾ '; color: var(--accent-warm); font-weight: 700; }
.mg-legend[open] summary::before { content: '▴ '; }
.mg-legend-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px 20px; margin-top: 12px; line-height: 1.55;
  color: var(--text-primary);
}
.mg-legend-grid strong { color: var(--accent-warm); }
.mg-food-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: white; border: 2px solid var(--border);
  border-radius: 8px; margin-bottom: 8px;
}
.mg-food-row .mg-food-name { font-weight: 600; }
.mg-food-row .mg-food-portion { color: var(--text-secondary); font-size: 14px; }
.mg-food-row .mg-food-emoji { font-size: 28px; margin-right: 10px; }
.mg-estimate-row {
  display: flex; align-items: center; gap: 12px; justify-content: center;
  margin: 20px 0; padding: 16px; background: white; border-radius: 8px; border: 2px solid var(--border);
}
.mg-estimate-row label { font-weight: 600; }
.mg-estimate-row input {
  width: 100px; padding: 10px; border: 2px solid var(--border); border-radius: 6px;
  font-size: 22px; font-weight: 700; text-align: center; font-family: var(--font-body);
}
.mg-estimate-row input:focus { outline: none; border-color: var(--accent); }
.mg-action-btn {
  padding: 12px 28px; background: var(--accent-warm); color: white;
  border: none; border-radius: 8px; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
}
.mg-action-btn:hover { background: #d4733c; transform: translateY(-1px); }
.mg-action-btn:disabled { background: #999; cursor: not-allowed; transform: none; }
.mg-result {
  margin-top: 16px; padding: 16px; border-radius: 8px; font-size: 15px; line-height: 1.6;
}
.mg-result.good { background: #e8f5e9; border: 2px solid var(--zone-green); }
.mg-result.ok { background: #fff8e1; border: 2px solid var(--zone-yellow); }
.mg-result.bad { background: #ffebee; border: 2px solid var(--zone-red); }
.mg-slider-row { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
.mg-slider-row input[type="range"] { flex: 1; }
.mg-slider-value { font-size: 22px; font-weight: 700; min-width: 60px; text-align: center; color: var(--accent); }
.mg-options-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px; margin: 16px 0;
}
.mg-option-card {
  background: white; border: 3px solid var(--border); border-radius: 10px;
  padding: 14px 10px; cursor: pointer; text-align: center;
  transition: all 0.15s; font-size: 14px;
}
.mg-option-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.mg-option-card.selected { border-color: var(--accent-warm); background: #FFF8E1; }
.mg-option-card .mg-opt-emoji { font-size: 36px; display: block; margin-bottom: 4px; }
.mg-option-card .mg-opt-name { font-weight: 600; }
.mg-option-card .mg-opt-carbs { color: var(--text-secondary); font-size: 12px; }

/* ============================================
   v0.2 additions
   ============================================ */
@keyframes edgePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
@keyframes pipAlarmRed { from { box-shadow: 0 0 0 3px rgba(244,67,54,0.9), 0 0 14px rgba(244,67,54,0.8); } to { box-shadow: 0 0 0 7px rgba(244,67,54,0.3), 0 0 30px rgba(244,67,54,0.9); } }
@keyframes pipAlarmAmber { from { box-shadow: 0 0 0 3px rgba(255,152,0,0.9), 0 0 12px rgba(255,152,0,0.7); } to { box-shadow: 0 0 0 6px rgba(255,152,0,0.25), 0 0 24px rgba(255,152,0,0.8); } }
@keyframes pipWobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
@keyframes badgeBounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.15); } }
@keyframes bgPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
@keyframes waitFill { from { width: 0; } to { width: 100%; } }
@keyframes dollBounce { 0% { transform: scale(1); } 40% { transform: scale(1.15) rotate(-4deg); } 100% { transform: scale(1); } }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

/* Pip alarm states: impossible to miss when BG is out of range */
body[data-bg="below"] #companion-face, body[data-bg="high"] #companion-face { border-color: #ff9800; animation: pipFloat 3s ease-in-out infinite, pipAlarmAmber 1s ease-in-out infinite alternate; }
body[data-bg="low"] #companion-face, body[data-bg="severe-low"] #companion-face, body[data-bg="very-high"] #companion-face { border-color: var(--zone-red); background: #5a2a2a; animation: pipWobble 0.5s ease-in-out infinite, pipAlarmRed 0.6s ease-in-out infinite alternate; }
#pip-badge { position: absolute; top: -10px; right: -10px; min-width: 24px; height: 24px; border-radius: 12px; background: var(--zone-red); color: #fff; font-size: 15px; font-weight: 800; display: none; align-items: center; justify-content: center; padding: 0 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
body[data-bg="below"] #pip-badge, body[data-bg="high"] #pip-badge { display: flex; background: #ff9800; animation: badgeBounce 1s infinite; }
body[data-bg="low"] #pip-badge, body[data-bg="severe-low"] #pip-badge, body[data-bg="very-high"] #pip-badge { display: flex; animation: badgeBounce 0.5s infinite; }
body[data-bg="low"] #hud-bg-value, body[data-bg="severe-low"] #hud-bg-value, body[data-bg="very-high"] #hud-bg-value { animation: bgPulse 0.8s infinite; }
#companion-bubble.hidden { display: none; }

/* HUD menu */
#hud-menu { background: transparent; border: 2px solid rgba(255,255,255,0.25); color: var(--hud-text); border-radius: 8px; font-size: 18px; width: 38px; height: 34px; cursor: pointer; }
#hud-menu:hover { border-color: var(--accent); }

/* Scene art (emoji illustrations) */
.scene-art { border-radius: 12px; padding: 14px 10px; margin-bottom: 16px; text-align: center; line-height: 1.25; overflow: hidden; }
.scene-big { font-size: 44px; letter-spacing: 6px; animation: floaty 4s ease-in-out infinite; }
.scene-row { font-size: 28px; letter-spacing: 4px; margin-top: 4px; }
.scene-morning { background: linear-gradient(180deg, #ffe0b2, #fff3e0); }
.scene-day { background: linear-gradient(180deg, #bbdefb, #e3f2fd); }
.scene-evening { background: linear-gradient(180deg, #f8bbd0, #ffe0b2); }
.scene-night { background: linear-gradient(180deg, #283593, #5c6bc0); }
.scene-alert { background: linear-gradient(180deg, #ffcdd2, #fff3e0); }

/* Food lists and tags */
.food-list { margin: 12px 0; }
.food-row { display: flex; gap: 12px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--border); }
.food-row:last-child { border-bottom: none; }
.food-emoji { font-size: 30px; width: 40px; text-align: center; }
.carb-tag { display: inline-block; font-size: 12px; font-weight: 600; background: rgba(91,143,185,0.15); color: #2d5f86; border-radius: 10px; padding: 1px 8px; margin-left: 4px; }
.choice-btn .carb-tag { background: rgba(255,255,255,0.25); color: #fff; }
.tip-box { background: #fffde7; border: 2px solid #ffe082; border-radius: 10px; padding: 12px 14px; margin: 14px 0; font-size: 15px; }
.bg-big { font-size: 22px; }
.bg-big.red { color: var(--zone-red); }
.bg-big.green { color: var(--zone-green); }
.bg-big.yellow { color: #d39e00; }

/* Re-selectable quizzes */
.quiz { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.quiz-option { text-align: left; padding: 12px 16px; border-radius: 10px; border: 3px solid var(--border); background: #fff; font-family: var(--font-body); font-size: 16px; cursor: pointer; transition: transform 0.1s, border-color 0.15s; }
.quiz-option:hover { border-color: var(--accent); transform: translateX(3px); }
.quiz-option.tried { opacity: 0.6; }
.quiz-option.picked.right { border-color: var(--zone-green); background: #e8f5e9; opacity: 1; }
.quiz-option.picked.tried { border-color: #ff9800; background: #fff8e1; }
.quiz-feedback { margin-top: 10px; padding: 0; font-size: 15px; }
.quiz-feedback.right { color: #2e7d32; }
.quiz-feedback.try { color: #8a5a00; }
.passage-quiz { margin-top: 8px; }

/* Mini-game intro + extras */
.mg-intro { text-align: center; }
.mg-intro-emoji { font-size: 64px; animation: floaty 3s ease-in-out infinite; }
.mg-how { text-align: left; margin: 14px auto 20px; max-width: 520px; padding-left: 22px; line-height: 1.6; }
.mg-how li { margin-bottom: 6px; }
.mg-action-btn.big { font-size: 20px; padding: 14px 28px; }
.mg-action-btn:disabled { opacity: 0.5; cursor: default; }
.mg-finish-emoji { font-size: 40px; margin-bottom: 4px; }
.mg-option-card.dim { opacity: 0.45; }
.mg-option-card.packed { border-color: var(--zone-green); background: #e8f5e9; }
.step-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
.step-dots span { width: 12px; height: 12px; border-radius: 50%; background: var(--border); }
.step-dots span.done { background: var(--zone-green); }
.step-dots span.now { background: var(--accent-warm); transform: scale(1.25); }
.step-card { background: #fff; border: 2px solid var(--border); border-radius: 10px; padding: 12px 14px; color: #333; }
.plate { background: #fff; border: 4px solid #e0d6c2; border-radius: 50%; width: 200px; height: 200px; margin: 10px auto 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; font-size: 40px; box-shadow: inset 0 0 0 10px #f7f2e8; }
.plate.big { width: 240px; height: 240px; }
.plate-item { text-align: center; }
.plate-item span { font-size: 38px; display: block; }
.plate-item small { font-size: 11px; color: #555; display: block; max-width: 80px; }
.hand-ref { text-align: center; font-size: 13px; color: var(--text-secondary); }
.bag-line { text-align: center; font-size: 22px; margin-top: 10px; min-height: 32px; }

/* Exercise Balance */
.ex-track { position: relative; height: 44px; background: linear-gradient(90deg, #c8e6c9, #a5d6a7); border-radius: 22px; margin: 10px 0; }
.ex-runner { position: absolute; top: 4px; left: 0; font-size: 30px; transition: left 0.35s linear; }
.ex-flag { position: absolute; right: 10px; top: 6px; font-size: 26px; }
.ex-meter { position: relative; height: 24px; background: linear-gradient(90deg, #ffcdd2, #fff9c4 20%, #fff9c4 80%, #ffcdd2); border-radius: 12px; margin: 22px 0 6px; }
.ex-green { position: absolute; top: 0; bottom: 0; background: rgba(76,175,80,0.55); }
.ex-marker { position: absolute; top: -8px; width: 4px; height: 40px; margin-left: -2px; background: #263238; border-radius: 2px; transition: left 0.35s linear; }
.ex-lbl { position: absolute; top: -20px; font-size: 12px; margin-left: -4px; color: #555; }
.ex-bg { text-align: center; font-size: 18px; }
.ex-bg strong { font-size: 28px; }
.ex-status { text-align: center; min-height: 24px; color: var(--text-secondary); }

/* Glucose Roller */
.roller-field { position: relative; max-width: 320px; margin: 0 auto; border: 2px solid var(--border); border-radius: 10px; overflow: hidden; background: linear-gradient(180deg, #ffcdd2, #fff9c4 25%, #fff9c4 75%, #ffcdd2); }
.roller-green { position: absolute; left: 0; right: 0; background: rgba(76,175,80,0.35); border-top: 2px dashed var(--zone-green); border-bottom: 2px dashed var(--zone-green); }
.roller-ball { position: absolute; left: 50%; transform: translateX(-50%); font-size: 28px; }
.roller-btns { display: flex; gap: 10px; justify-content: center; margin: 8px 0; }
.roller-progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.roller-progress div { height: 100%; width: 0; background: var(--accent); }

/* Nutrition Facts label */
.nf-label { background: #fff; border: 3px solid #000; padding: 12px 14px; border-radius: 4px; max-width: 300px; margin: 0 auto 16px; font-family: Arial, sans-serif; color: #000; font-size: 13px; line-height: 1.4; }
.nf-title { font-size: 20px; font-weight: bold; }
.nf-sub { font-size: 12px; border-bottom: 1px solid #000; }
.nf-line { border-bottom: 1px solid #000; padding: 3px 0; }
.nf-thick { border-bottom: 6px solid #000; }
.nf-row { display: flex; justify-content: space-between; }
.nf-indent { padding-left: 14px; }
.step-q { margin: 8px 0; }

/* Low-BG wait timer */
.wait-timer { height: 14px; background: var(--border); border-radius: 7px; overflow: hidden; margin: 14px 0 4px; }
.wait-timer-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--zone-green)); animation: waitFill 3.5s linear forwards; }
.continue-btn:disabled { opacity: 0.6; cursor: default; }
.routine { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
.r-step { padding: 10px 14px; border-radius: 10px; background: #fff; border: 2px solid var(--border); font-size: 16px; }
.r-step.done { border-color: var(--zone-green); background: #e8f5e9; }
.r-step.now { border-color: var(--accent-warm); background: #fff8e1; font-weight: 600; }

/* Tutorial spotlight */
.tip-shield { position: fixed; inset: 0; z-index: 1500; background: rgba(10,12,24,0.55); }
.tip-target { position: relative; z-index: 1600 !important; box-shadow: 0 0 0 4px #ffd54f, 0 0 24px #ffd54f; border-radius: 10px; background: var(--hud-bg); }
#hud.tip-host { z-index: 1600; }
.tip-bubble { position: fixed; z-index: 1700; background: #fffde7; color: #2c2c2c; border: 3px solid #ffd54f; border-radius: 14px; padding: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.4); animation: bubblePop 0.3s cubic-bezier(0.34,1.56,0.64,1); }
.tip-pip { font-size: 28px; float: left; margin-right: 10px; }
.tip-text { font-size: 15px; line-height: 1.5; overflow: hidden; }
.tip-actions { clear: both; display: flex; justify-content: space-between; margin-top: 12px; }
.tip-ok { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-size: 15px; cursor: pointer; }
.tip-skip { background: transparent; border: none; color: #777; text-decoration: underline; cursor: pointer; font-size: 13px; }

/* In-page modal */
#modal-overlay { position: fixed; inset: 0; z-index: 2000; background: rgba(10,12,24,0.75); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeIn 0.2s ease; }
.modal-box { background: var(--bg-card); border-radius: 14px; padding: 22px 24px; max-width: 440px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.modal-box h2 { margin-bottom: 10px; font-size: 22px; }
.modal-body p { margin-bottom: 8px; }
.modal-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.modal-btn { padding: 10px 16px; border-radius: 8px; border: 2px solid var(--border); background: #fff; font-family: var(--font-body); font-size: 15px; cursor: pointer; }
.modal-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.modal-btn.danger { background: var(--zone-red); border-color: var(--zone-red); color: #fff; }

/* Save slots */
.slot-note { color: var(--text-secondary); font-size: 14px; margin-bottom: 14px; }
.slots { display: flex; flex-direction: column; gap: 10px; }
.slot-card { display: flex; align-items: center; gap: 14px; background: #fff; border: 2px solid var(--border); border-radius: 12px; padding: 10px 14px; }
.slot-card.empty { border-style: dashed; }
.slot-info { flex: 1; }
.slot-btns { display: flex; gap: 6px; }
.muted { color: #888; }

/* Avatar doll (creation preview + slots) */
.avatar-doll { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.05; min-width: 40px; }
.avatar-doll .d-hat { font-size: 18px; height: 20px; }
.avatar-doll .d-face { font-size: 26px; }
.avatar-doll .d-shirt { width: 28px; height: 20px; border-radius: 6px 6px 3px 3px; margin-top: -2px; }
.avatar-doll .d-shoes { font-size: 14px; }
.avatar-doll.big .d-hat { font-size: 48px; height: 52px; }
.avatar-doll.big .d-face { font-size: 72px; }
.avatar-doll.big .d-shirt { width: 80px; height: 60px; border-radius: 18px 18px 8px 8px; }
.avatar-doll.big .d-shoes { font-size: 36px; letter-spacing: 10px; }
.avatar-doll.bounce { animation: dollBounce 0.4s ease; }
.appearance-layout { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
.doll-preview { background: linear-gradient(180deg, #e3f2fd, #fff); border-radius: 14px; padding: 16px 22px; text-align: center; min-width: 150px; }
.doll-name { margin-top: 6px; font-weight: 700; }
.dev-emoji { font-size: 32px; }
.pip-intro { font-size: 64px; text-align: center; animation: floaty 2.5s ease-in-out infinite; }
.title-art { font-size: 34px; letter-spacing: 8px; margin-bottom: 8px; animation: floaty 4s ease-in-out infinite; }

/* Day summary */
.sparkline { width: 100%; height: 80px; background: #fff; border-radius: 8px; border: 1px solid var(--border); }
.spark-cap { font-size: 12px; color: var(--text-secondary); text-align: center; margin: 4px 0 12px; }
.wk-chart { display: flex; gap: 6px; align-items: flex-end; height: 140px; margin: 8px 0 16px; }
.wk-bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 12px; }
.wk-fill { width: 70%; background: var(--zone-green); border-radius: 4px 4px 0 0; min-height: 2px; }
.wk-bar small { color: var(--text-secondary); }

@media (max-width: 640px) {
  #hud { flex-wrap: wrap; height: auto; gap: 6px 12px; padding: 6px 10px; font-size: 12px; }
  #hud-bg-bar, #hud-energy-bar { width: 50px; }
  .scene-big { font-size: 36px; }
}
.src-note { font-size: 12px; color: var(--text-secondary); font-style: italic; margin: 6px 0; }
  </style>
</head>
<body>
  <div id="game">
    <header id="hud" class="hidden">
      <div id="hud-avatar">
        <div id="hud-avatar-figure">
          <span class="av-hat"></span>
          <span class="av-face"></span>
          <span class="av-shirt"></span>
          <span class="av-shoes"></span>
        </div>
        <span id="hud-avatar-name"></span>
      </div>
      <div id="hud-bg">
        <span id="hud-bg-label">BG</span>
        <span id="hud-bg-value">--</span>
        <span id="hud-bg-trend"></span>
        <div id="hud-bg-bar"><div id="hud-bg-fill"></div></div>
      </div>
      <div id="hud-energy">
        <span id="hud-energy-label">Energy</span>
        <div id="hud-energy-bar"><div id="hud-energy-fill"></div></div>
      </div>
      <div id="hud-confidence">
        <span id="hud-confidence-label">Confidence</span>
        <span id="hud-confidence-value">50</span>
      </div>
      <div id="hud-time">
        <span id="hud-day">Day 1</span>
        <span id="hud-clock">7:00 AM</span>
      </div>
      <div id="hud-collectibles">
        <span id="hud-beta-cells">0 / 48</span>
        <span id="hud-beta-label">Beta Cells</span>
      </div>
      <button id="hud-menu" title="Menu and saving">☰</button>
    </header>
    <main id="narrative">
      <div id="passage-container"></div>
    </main>
    <div id="companion" class="hidden">
      <div id="companion-face">
        <div id="pip-antenna"></div>
        <div id="pip-visor">
          <div id="pip-eyes">
            <span class="pip-eye"></span>
            <span class="pip-eye"></span>
          </div>
        </div>
        <div id="pip-led"></div>
        <span id="pip-nametag">Pip</span>
        <span id="pip-badge"></span>
      </div>
      <div id="companion-bubble" class="hidden">
        <p id="companion-text"></p>
      </div>
    </div>
    <div id="screen-effects"></div>
  </div>

<script src="js/game.js"></script>
</body>
